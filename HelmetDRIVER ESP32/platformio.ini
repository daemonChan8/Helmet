[env:helmet_driver_ESP32]
platform = espressif32
board = esp32dev
framework = arduino

board_build.flash_size = 4MB
board_build.partitions = huge_app.csv

monitor_speed = 115200
upload_speed = 921600

lib_deps =
  plerup/EspSoftwareSerial @ ^8.2.0
  mikalhart/TinyGPSPlus @ ^1.1.0
  
build_flags =
  -DUSE_ARDUINO